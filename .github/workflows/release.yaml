name: Release and Publish
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      releaseVersion:
        type: string
        description: "the maas-pubsubplus-configs release version to create, example: 1.0.0"
        required: true
      githubRelease:
        type: boolean
        description: Create github release
        required: true
        default: true
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v2

      - name: Release package
        run: ./gradlew -Pversion="${{ github.event.inputs.releaseVersion }}" build publish --refresh-dependencies
        env:
          GITHUB_USERNAME: ${{ secrets.PACKAGES_ADMIN_USER }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_ADMIN_TOKEN }}

      - name: Changelog
        uses: Bullrich/generate-release-changelog@master
        id: Changelog
        env:
          REPO: ${{ github.repository }}

      - name: Create github release
        if: github.event.inputs.githubRelease
        id: create_github_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v${{ github.event.inputs.releaseVersion }}
          release_name: v${{ github.event.inputs.releaseVersion }}
          body: |
            ${{ steps.Changelog.outputs.changelog }}
          draft: false
          prerelease: false

  # Full FOSSA scan of the tagged release, uploaded to Guardian. Runs after the
  # release job so the v<version> tag exists to scan.
  sca-scan:
    needs: release
    if: ${{ github.event.inputs.githubRelease == 'true' }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
      checks: write
      statuses: write
      packages: read
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@ba836c78c24cb222c480d6aced53ecd09189baee
    with:
      git_ref: v${{ github.event.inputs.releaseVersion }}
      use_vault: false
      config_file: ".github/workflow-config.json"
      setup_actions: '["setup-java"]'
      java_version: "17"
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}