name: build

# Builds and tests. Holds no secrets and never publishes: with `stage: true` it
# uploads the jar and its POM as the `maven-publication` artifact, and
# release.yaml's publish job (in the `release` environment) deploys them with
# .github/actions/publish-maven. Build code never runs next to the package
# credentials.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build and test (e.g. a PR head). Ignored when staging, which always builds github.sha."
        type: string
        required: false
        default: ""
      stage:
        description: "Upload the jar and POM as the maven-publication artifact"
        type: boolean
        default: false
      version:
        description: "Release version to stage, e.g. 1.2.3. Required when staging without snapshot."
        type: string
        required: false
        default: ""
      snapshot:
        description: "Stage a SNAPSHOT version derived from the branch and commit instead of `version`"
        type: boolean
        default: false
    outputs:
      version:
        description: "The staged version (empty when not staging)"
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build and test (defaults to the ref this workflow runs on)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        if: ${{ inputs.stage }}
        id: version
        env:
          VERSION: ${{ inputs.version }}
          SNAPSHOT: ${{ inputs.snapshot }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$SNAPSHOT" == "true" ]]; then
            VERSION="${REF_NAME//\//_}-${SHA::7}-SNAPSHOT"
          elif [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.stage && github.sha || inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -n "$VERSION" ]]; then
            ./gradlew -Pversion="$VERSION" build generatePomFileForJarPublication
          else
            ./gradlew build
          fi

      - name: Upload publication
        if: ${{ inputs.stage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-publication
          path: |
            build/libs/maas-pubsubplus-configs.jar
            build/publications/jar/pom-default.xml
          if-no-files-found: error
          retention-days: 7
