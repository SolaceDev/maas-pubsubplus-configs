name: build

on:
  workflow_call:
    inputs:
      publish-snapshot:
        description: "Publish a SNAPSHOT to GitHub Packages (default branch only)"
        type: boolean
        default: false
      ref:
        description: "Git ref to build (defaults to the default branch)"
        type: string
        required: false
  workflow_dispatch:
    inputs:
      publish-snapshot:
        description: "Publish a SNAPSHOT to GitHub Packages (default branch only)"
        type: boolean
        default: false
      ref:
        description: "Git ref to build (defaults to the default branch)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Enter the default-branch-only `release` environment (which holds the
    # publish PAT) only when publishing a snapshot.
    environment: ${{ inputs['publish-snapshot'] && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and test
        run: ./gradlew build

      - name: Resolve SNAPSHOT version
        if: ${{ inputs['publish-snapshot'] }}
        id: version
        env:
          REF_NAME: ${{ inputs.ref || github.ref_name }}
        run: |
          echo "snapshot=${REF_NAME//\//_}-$(git rev-parse --short HEAD)-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Publish SNAPSHOT
        if: ${{ inputs['publish-snapshot'] }}
        env:
          VERSION: ${{ steps.version.outputs.snapshot }}
          GITHUB_USERNAME: ${{ secrets.PACKAGES_ADMIN_USER }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_ADMIN_TOKEN }}
        run: ./gradlew -Pversion="$VERSION" publish
