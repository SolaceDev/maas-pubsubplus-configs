name: FOSSA SCA Scan

# FOSSA SCA + Guardian upload. The push-to-develop run populates FOSSA so the
# nightly Guardian scan has trunk data to fetch.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read
  checks: write
  statuses: write
  packages: read

jobs:
  sca-scan:
    name: FOSSA Scan
    # Skip fork PRs — they can't access the FOSSA secret.
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@ba836c78c24cb222c480d6aced53ecd09189baee
    with:
      use_vault: false
      config_file: ".github/workflow-config.json"
      setup_actions: '["setup-java"]'
      java_version: "17"
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
